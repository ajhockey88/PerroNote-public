name: PerroNote
options:
  bundleIdPrefix: com.ajhockey88
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.7
targets:
  PerroNote:
    type: application
    platform: iOS
    sources:
      - PerroNote
    dependencies:
      - target: PerroNoteWidgets
      - package: FluidAudio
    info:
      path: PerroNote/Info.plist
      properties:
        CFBundleDisplayName: PerroNote
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "17"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        UIAppFonts:
          - PermanentMarker-Regular.ttf
        NSMicrophoneUsageDescription: PerroNote records your meetings so it can turn them into notes.
        NSSpeechRecognitionUsageDescription: PerroNote converts your meeting recordings to text on your iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajhockey88.perronote
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PerroNoteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - PerroNoteWidgets
      - PerroNote/RecordingAttributes.swift
      - PerroNote/StartRecordingIntent.swift
      - PerroNote/CassetteView.swift
      - PerroNote/Fonts
    info:
      path: PerroNoteWidgets/Info.plist
      properties:
        CFBundleDisplayName: PerroNote Recording
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "17"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - PermanentMarker-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajhockey88.perronote.widgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
