name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: Build
        run: |
          xcodebuild \
            -project PerroNote.xcodeproj \
            -scheme PerroNote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || {
              grep -n -A8 "error:" xcodebuild.log | head -300
              tail -40 xcodebuild.log
              exit 1
            }

      - name: Package
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PerroNote.app Payload/
          zip -qry PerroNote.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: PerroNote-ipa
          path: PerroNote.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Read version
        id: version
        run: |
          v=$(grep -m1 'CFBundleShortVersionString' project.yml | sed -E 's/.*"(.*)".*/\1/')
          b=$(grep -m1 'CFBundleVersion:' project.yml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build=$b" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PerroNote ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }})
          body: Unsigned IPA built from ${{ github.sha }}.
          files: PerroNote.ipa
          make_latest: true
