<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>PerroNote</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face {
  font-family: "Permanent Marker";
  src: url("PermanentMarker-Regular.ttf") format("truetype");
  font-display: swap;
}
:root {
  --bg: #f6f5f3;
  --surface: #ffffff;
  --surface-2: #f1efec;
  --text: #1d1b19;
  --muted: #6f6a64;
  --border: #e4e0db;
  --accent: #FF7A45;
  --accent-strong: #e85f27;
  --accent-soft: rgba(255, 122, 69, 0.12);
  --red: #E5413A;
  --red-soft: rgba(229, 65, 58, 0.1);
  --orange: #e8701e;
  --blue: #2f74d0;
  --warn-bg: #fff6e0;
  --warn-border: #f0d48a;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.04);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141312;
    --surface: #1e1c1b;
    --surface-2: #2a2826;
    --text: #f2efec;
    --muted: #a39d96;
    --border: #353230;
    --accent-soft: rgba(255, 122, 69, 0.18);
    --red-soft: rgba(229, 65, 58, 0.18);
    --orange: #ff9a4d;
    --blue: #6aa6ff;
    --warn-bg: #3a2f14;
    --warn-border: #6b5520;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
}
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* Top bar */
header.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--border);
}
.top-inner {
  max-width: 860px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.wordmark {
  font-family: "Permanent Marker", cursive; font-weight: 400; font-size: 22px; letter-spacing: 0; text-decoration: none;
  display: flex; align-items: center; gap: 8px;
}
.wordmark .logo { width: 30px; height: 30px; border-radius: 7px; display: block; }
.wordmark .note { color: var(--accent); }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.tab {
  text-decoration: none; padding: 5px 12px; border-radius: 8px; font-size: 14px; font-weight: 550; color: var(--muted); white-space: nowrap;
}
.tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.top-actions { margin-left: auto; display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0;
}
.icon-btn:hover { color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 560px) {
  .tabs { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1 0 auto; text-align: center; padding: 5px 10px; }
}

main { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
h1 { font-family: "Permanent Marker", cursive; font-weight: 400; font-size: 30px; letter-spacing: 0; margin: 4px 0 16px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; font-weight: 650; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Controls */
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 14px;
  cursor: pointer; font-weight: 550; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
}
.btn:hover { border-color: color-mix(in srgb, var(--border) 50%, var(--text)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.danger { color: var(--red); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary:disabled { background: var(--accent); }
input[type=text], input[type=password], input[type=search], input[type=date], textarea, select {
  width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px 12px; outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: none; overflow: hidden; min-height: 42px; line-height: 1.5; display: block; }
label.field { display: block; margin-bottom: 14px; }
label.field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel { padding: 18px; margin-bottom: 14px; }
.notice { padding: 28px 20px; text-align: center; }
.notice p { margin: 6px 0 14px; }
.error-box { border-color: color-mix(in srgb, var(--red) 40%, var(--border)); }
.error-box strong { color: var(--red); }
.warn-box { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
.warn-box dl { margin: 8px 0 0; }
.warn-box dt { font-weight: 650; font-size: 13px; margin-top: 8px; }
.warn-box dd { margin: 2px 0 0; white-space: pre-wrap; font-size: 14px; user-select: text; }

/* Meetings list */
.search-row { display: flex; gap: 10px; margin-bottom: 12px; }
.search-row .btn { flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; color: var(--muted);
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.tag { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-weight: 550; }
@media (prefers-color-scheme: dark) { .tag { color: var(--accent); } }
.list { display: flex; flex-direction: column; gap: 10px; }
.meeting-card { display: block; padding: 14px 16px; text-decoration: none; transition: border-color 0.15s; }
.meeting-card:hover { border-color: var(--accent); }
.meeting-card .title { font-weight: 650; font-size: 16px; margin-bottom: 3px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--muted); }
.open-count { color: var(--accent-strong); font-weight: 600; }
@media (prefers-color-scheme: dark) { .open-count { color: var(--accent); } }
.tags-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }

/* Meeting page */
.toolbar {
  position: sticky; top: 57px; z-index: 10; display: flex; align-items: center; gap: 10px;
  padding: 10px 0; margin: -10px 0 8px; background: var(--bg);
}
@media (max-width: 560px) { .toolbar { top: 99px; } }
.toolbar .btn { white-space: nowrap; }
.toolbar .status { margin-left: auto; font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toolbar .status.dirty { color: var(--accent-strong); font-weight: 600; }
.title-input {
  font-size: 24px !important; font-weight: 700; letter-spacing: -0.02em; border: 1px solid transparent !important; background: transparent !important; padding: 4px 8px !important; margin-left: -8px; width: calc(100% + 16px) !important;
}
.title-input:hover { border-color: var(--border) !important; }
.title-input:focus { border-color: var(--accent) !important; background: var(--surface) !important; }
.section { padding: 16px 18px; margin-bottom: 12px; }
.section textarea { border-color: transparent; background: transparent; padding: 4px 8px; min-height: 28px; }
.section textarea:hover { background: var(--surface-2); }
.section textarea:focus { background: var(--surface); }
.section .brow textarea { padding: 3px 8px; min-height: 26px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.topic { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
.topic:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.topic-head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.topic-head input { font-weight: 650; }
.mcal { width: 100%; }
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-head h2 { margin: 0 auto 0 4px; font-size: 18px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: center; padding: 4px 0; }
.cal-day { min-height: 110px; padding: 4px 5px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); text-align: left; font: inherit; color: inherit; cursor: pointer; overflow: hidden; display: block; width: 100%; }
.cal-day.out { opacity: .45; }
.cal-day.today .n { background: var(--accent); color: #fff; }
.cal-day.sel { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange); }
.cal-day .n { display: inline-block; min-width: 20px; text-align: center; border-radius: 999px; font-size: 12px; font-weight: 650; }
.cal-ev { display: block; font-size: 11px; line-height: 1.3; margin-top: 2px; padding: 1px 4px; border-radius: 5px; background: var(--accent-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-ev.mtg { background: var(--surface-2); color: var(--muted); }
.cal-ev.od { background: color-mix(in srgb, var(--red) 18%, transparent); }
.cal-more { font-size: 11px; color: var(--muted); margin-top: 2px; }
@media (max-width: 640px) { .cal-day { min-height: 52px; } .cal-ev { display: none; } .cal-day .dots { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; } }
@media (min-width: 641px) { .cal-day .dots { display: none; } }
.cal-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.cal-dot.mtg { background: var(--muted); }
.tcard.done .task { text-decoration: line-through; opacity: .55; }
.itag { display: inline-block; font-size: 11.5px; font-weight: 600; color: var(--accent-strong); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; margin-left: 6px; white-space: nowrap; }
.tagbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.tagbar .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.item-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.brow { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 0; }
.brow .bul { font-size: 18px; flex: 0 0 18px; text-align: center; padding-top: 4px; color: var(--accent-strong); font-weight: 700; line-height: 1.5; }
.brow.sub { margin-left: 26px; }
.brow.sub .bul { font-size: 0; padding-top: 10px; }
.brow.sub .bul::before { content: ''; display: inline-block; width: 6px; height: 6px; border: 1.5px solid var(--accent-strong); border-radius: 50%; }
.brow textarea { flex: 1; min-width: 0; }
.brow .mini { flex: 0 0 auto; padding: 3px 7px; font-size: 12px; }
.section.changed, .section.changed.summary { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange); }
.subs { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--border); font-size: 13px; color: var(--muted); }
.subs .pt { color: var(--text); font-weight: 550; margin-top: 4px; }
.subs ul { margin: 2px 0 0; padding-left: 20px; }
.item-row { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px 8px; align-items: start; padding: 10px 0; border-top: 1px solid var(--border); }
.item-row:first-child { border-top: 0; padding-top: 0; }
.item-row .task { grid-column: 2 / 3; }
.item-row .del { grid-column: 3; grid-row: 1; }
.item-row .sub { grid-column: 2 / 4; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.item-row input[type=text] { padding: 7px 10px; }
.item-row .sub input { font-size: 13px; }
.item-row.done .task { text-decoration: line-through; color: var(--muted); }
.check {
  appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 7px 0 0; border: 2px solid color-mix(in srgb, var(--muted) 60%, transparent); border-radius: 50%;
  cursor: pointer; display: grid; place-items: center; background: var(--surface); flex: none;
}
.check:checked { background: var(--accent); border-color: var(--accent); }
.check:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.check:disabled { opacity: 0.5; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.empty-note { color: var(--muted); font-style: italic; }

/* Action items page */
.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.filters select { width: auto; min-width: 140px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; user-select: none; }
.switch input { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; margin: 0; transition: background 0.15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: left 0.15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 18px; }
.filters .btn.primary { margin-left: auto; }
.group { margin-bottom: 18px; }
.group h2 { display: flex; align-items: center; gap: 8px; }
.group h2 .count { font-weight: 600; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 0 8px; font-size: 12px; letter-spacing: 0; }
.group.overdue h2 { color: var(--red); }
.group.today h2 { color: var(--orange); }
.group.tomorrow h2 { color: var(--blue); }
.rows { overflow: hidden; }
.arow { display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); align-items: flex-start; }
.arow:first-child { border-top: 0; }
.arow .check { margin-top: 1px; }
.arow .del-item { padding: 2px 8px; flex: none; }
.arow .body { min-width: 0; flex: 1; }
.arow .task { overflow-wrap: anywhere; }
.arow.done .task { text-decoration: line-through; color: var(--muted); }
.arow .meta a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; }
.arow .meta a:hover { color: var(--accent); }
.arow .body { cursor: pointer; }
.tcard .body, .frow .body { cursor: pointer; }
.tcard.open, .frow.open { background: color-mix(in srgb, var(--accent) 4%, var(--surface)); }
.frow.open { align-items: flex-start; }
.tcard .details .fgrid { grid-template-columns: 1fr; }
.tcard .details { padding: 10px; }
.arow.open { background: color-mix(in srgb, var(--accent) 4%, var(--surface)); }
.details { margin: 10px 0 2px; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; cursor: default; }
.details label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.details textarea { width: 100%; background: var(--surface); min-height: 84px; }
.details input[type=text], .details input[type=date] { width: 100%; background: var(--surface); padding: 7px 10px; }
.details .fld { margin-bottom: 10px; min-width: 0; }
.details .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.details .fgrid .fld:first-child { grid-column: 1 / -1; }
.details .due-in { display: flex; gap: 6px; flex-wrap: wrap; }
.details .due-in input { flex: 1 1 130px; min-width: 0; }
.details .due-in .btn { flex: none; padding: 6px 10px; }
.details .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
@media (max-width: 560px) { .details .fgrid { grid-template-columns: 1fr; } }
.details .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.details .row .muted { font-size: 12.5px; margin-left: auto; }
.note-line { display: flex; gap: 6px; align-items: flex-start; margin-top: 5px; font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; white-space: pre-line; }
.pin { flex: none; border: 0; background: none; color: var(--muted); font-size: 17px; line-height: 1; padding: 0 2px; cursor: pointer; font-family: inherit; }
.pin:hover { color: var(--accent); }
.pin.on { color: var(--accent); }
.item-row .note-in { grid-column: 1 / 3; }
/* Today's focus */
.focus { padding: 16px 18px; margin-bottom: 18px; border-color: color-mix(in srgb, var(--accent) 30%, var(--border)); }
.focus-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.focus-head h2 { margin: 0; color: var(--accent-strong); }
@media (prefers-color-scheme: dark) { .focus-head h2 { color: var(--accent); } }
.focus-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, #ff8a55, #f0602a); box-shadow: 0 3px 8px rgba(240,96,42,.3); flex: none; }
.focus-ic svg { width: 18px; height: 18px; }
.focus-head .prog { flex: 1; min-width: 60px; max-width: 220px; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.focus-head .prog i { display: block; height: 100%; background: linear-gradient(90deg, #ff8a55, #f0602a); border-radius: 99px; }
.focus-head .cnt { font-size: 13px; color: var(--muted); font-weight: 600; }
.focus-head .btn { margin-left: auto; }
.frow { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-top: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.frow:first-child { border-top: 0; }
.frow .grip { color: var(--muted); cursor: grab; font-size: 16px; letter-spacing: -3px; width: 14px; opacity: .6; touch-action: none; user-select: none; flex: none; }
.frow .body { flex: 1; min-width: 0; }
.frow .task { font-weight: 600; overflow-wrap: anywhere; }
.frow .meta { font-size: 12.5px; }
.frow .meta a { color: var(--muted); text-decoration: none; }
.frow .meta a:hover { color: var(--accent); }
.frow.done .task { text-decoration: line-through; color: var(--muted); }
.frow .note-ic { font-size: 12.5px; color: var(--muted); margin-left: 8px; font-weight: 400; }
.frow .x { flex: none; padding: 2px 8px; }
.frow.drag { box-shadow: 0 8px 24px rgba(0,0,0,.12); position: relative; z-index: 2; border-top-color: transparent; }
.focus .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.suggest { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 13.5px; color: var(--muted); }
.suggest .chip { color: var(--text); cursor: pointer; font-family: inherit; }
.suggest form { display: flex; gap: 8px; flex: 1; min-width: 220px; }
.suggest form input { flex: 1; padding: 6px 10px; }
.due.overdue { color: var(--red); font-weight: 600; }
.due.today { color: var(--orange); font-weight: 600; }
.due.tomorrow { color: var(--blue); font-weight: 600; }
.add-form { padding: 14px 16px; margin-bottom: 16px; display: grid; grid-template-columns: 1fr 170px auto auto; gap: 8px; align-items: center; }
@media (max-width: 560px) { .add-form { grid-template-columns: 1fr 1fr; } .add-form .task-in { grid-column: 1 / 3; } }

/* Settings */
.setup { max-width: 520px; margin: 0 auto; }
.setup ol { padding-left: 20px; margin: 8px 0 18px; color: var(--muted); font-size: 14px; }
.setup ol li { margin-bottom: 4px; }
.setup a { color: var(--accent-strong); }
@media (prefers-color-scheme: dark) { .setup a { color: var(--accent); } }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-row .right { margin-left: auto; }

/* Toast */
#sync-pill { position: fixed; right: 20px; bottom: 20px; z-index: 45; display: flex; align-items: center; gap: 9px; max-width: calc(100% - 32px);
  border: 0; border-radius: 999px; padding: 11px 18px; background: var(--orange); color: #fff; font: inherit; font-size: 14px; font-weight: 650;
  box-shadow: 0 8px 24px rgba(0,0,0,0.22); cursor: pointer; text-align: left; }
#sync-pill:hover { filter: brightness(1.05); }
#sync-pill:disabled { opacity: .8; cursor: default; }
#sync-pill .dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; flex: none; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (max-width: 560px) { #sync-pill { left: 16px; right: 16px; bottom: 16px; justify-content: center; } }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2); transition: opacity 0.2s, transform 0.2s; z-index: 50; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
#toast.error { background: var(--red); color: #fff; }
.loading { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 40px 0; color: var(--muted); }
/* Summary strip */
.strip {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; text-align: left; padding: 10px 14px; margin: -4px 0 14px;
  cursor: pointer; font-size: 14px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
}
.strip:hover { border-color: var(--accent); }
.strip .lbl { color: var(--muted); font-weight: 600; font-size: 13px; }
.strip .od { color: var(--red); font-weight: 600; }
.strip .td { color: var(--orange); font-weight: 600; }
.strip .go { margin-left: auto; color: var(--muted); }

/* Share menu */
.share-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: min(280px, calc(100vw - 32px)); padding: 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.menu label.field { margin-bottom: 6px; }
.menu .btn { width: 100%; justify-content: flex-start; }
.menu .small a { color: var(--muted); }

/* Select mode and bulk */
.meeting-card.selectable { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.meeting-card.selectable .check { margin-top: 1px; }
.meeting-card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.meeting-card .grow { min-width: 0; flex: 1; }
.select-bar { padding: 12px 14px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
.select-bar .line { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.select-bar .line input, .select-bar .line select { flex: 1 1 140px; width: auto; min-width: 0; }
.bulk-msg { padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
.bulk-msg ul { margin: 6px 0 0; padding-left: 20px; }
.bulk-msg.error-box { border-color: color-mix(in srgb, var(--red) 40%, var(--border)); }
.chip.manage { border-style: dashed; }

/* Lists of people, dates, tags */
.lrow { display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); align-items: center; text-decoration: none; }
.lrow:first-child { border-top: 0; }
a.lrow:hover .name { color: var(--accent); }
.lrow .body { min-width: 0; flex: 1; }
.lrow .name, .lrow .text { overflow-wrap: anywhere; }
.lrow .name { font-weight: 600; }
.lrow .meta a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; }
.lrow .meta a:hover { color: var(--accent); }
.lrow .acts { display: flex; gap: 6px; flex: none; }
.lrow .acts .btn { padding: 6px 10px; font-size: 13px; }
.when.today { color: var(--orange); font-weight: 600; }
.when.soon { color: var(--blue); font-weight: 600; }
details.fold { margin: 10px 0 18px; }
details.fold > summary { cursor: pointer; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 650; margin-bottom: 10px; }
.page-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.page-head h1 { margin-right: auto; }
.danger-zone { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border); }
.btn.danger { border-color: color-mix(in srgb, var(--red) 35%, var(--border)); }
.recip-list { margin: 0 0 12px; }
.recip-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
@media (max-width: 560px) { .recip-form { grid-template-columns: 1fr; } }

/* Print */
#printView { display: none; }
.pv { color: #000; background: #fff; font: 11pt/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
.pv .pv-title { font-size: 20pt; font-weight: 700; margin: 0 0 2px; }
.pv .pv-date { color: #555; margin: 0 0 12px; }
.pv .pv-h { font-size: 13pt; font-weight: 700; margin: 16px 0 4px; color: #b84617; break-after: avoid; page-break-after: avoid; }
.pv .pv-h3 { font-weight: 700; margin: 8px 0 2px; }
.pv p { margin: 0 0 6px; }
.pv ul { margin: 2px 0; padding-left: 22px; }
.pv ul.plain { list-style: none; padding-left: 0; }
.pv li { margin: 1px 0; break-inside: avoid; }
@media print {
  header.top, #toast, .toolbar, .btn, button, .strip, .select-bar, .no-print, .sidebar, .list-pane, .rail { display: none !important; }
  html, body { background: #fff !important; color: #000 !important; }
  main, body.desk main, body.desk main.split { padding: 0 !important; max-width: none; margin: 0 !important; display: block !important; }
  .card { box-shadow: none !important; }
  input, textarea, select { border: 0 !important; background: transparent !important; box-shadow: none !important; }
  body.print-notes #app { display: none !important; }
  body.print-notes #printView { display: block !important; }
}
/* People chips (attendees) */
.people-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pchip { display: inline-flex; align-items: center; gap: 7px; background: var(--surface-2); border-radius: 999px; padding: 3px 6px 3px 3px; font-size: 14px; max-width: 100%; }
.pchip a { text-decoration: none; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pchip a:hover { color: var(--accent); }
.pchip .x { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 13px; line-height: 1; opacity: 0.55; }
.pchip:hover .x, .pchip .x:focus { opacity: 1; }
.pchip .x:hover { color: var(--red); }
.av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 10.5px; font-weight: 700; flex: none; letter-spacing: 0.02em; }
.av.sm { width: 20px; height: 20px; font-size: 9px; }
.av.lg { width: 34px; height: 34px; font-size: 12.5px; }
.add-chip { border: 1px dashed var(--border); background: transparent; border-radius: 999px; padding: 5px 13px; font-size: 14px; color: var(--muted); cursor: pointer; }
.add-chip:hover { color: var(--accent); border-color: var(--accent); }
.add-person { width: 200px !important; border-radius: 999px !important; padding: 5px 12px !important; }
.tag-chips { gap: 6px; }
.tchip { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; padding: 3px 4px 3px 11px; }
.tchip .x { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 0 5px; font-size: 11px; opacity: 0.55; }
.tchip .x:hover, .tchip .x:focus { opacity: 1; }
.add-chip.sm { font-size: 13px; padding: 3px 11px; }
.add-person.sm { width: 150px !important; padding: 3px 11px !important; font-size: 13px; }
.section.summary { background: linear-gradient(135deg, var(--accent-soft), transparent 65%), var(--surface); border-color: color-mix(in srgb, var(--accent) 28%, var(--border)); }
.section.summary h2 { color: var(--accent-strong); }
@media (prefers-color-scheme: dark) { .section.summary h2 { color: var(--accent); } }
.section h2 .count { font-weight: 600; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 0 8px; font-size: 12px; letter-spacing: 0; margin-left: 6px; }
.chip { white-space: nowrap; text-decoration: none; }
.chip-x { margin-left: 6px; opacity: 0.8; }
.chips-label { font-size: 12px; font-weight: 650; color: var(--muted); align-self: center; margin-right: 2px; }
.date-pick { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
.pick-wrap { position: relative; display: inline-flex; }
.filter-note { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin: -6px 0 12px; }

/* Sidebar (desktop) */
.sidebar { display: none; }
.sidebar {
  --side-bg: #1f1d1b; --side-text: #ece7e1; --side-muted: #9d968e; --side-hover: rgba(255,255,255,0.06); --side-active: rgba(255,255,255,0.1);
}
@media (prefers-color-scheme: dark) { .sidebar { --side-bg: #0f0e0d; } }
body.desk .sidebar {
  display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; width: 240px; z-index: 25;
  background: var(--side-bg); color: var(--side-text); padding: 18px 12px 12px;
}
.sidebar .wordmark { padding: 4px 8px 18px; font-size: 21px; }
.sidebar .wordmark .note { color: var(--accent); }
.side-scroll { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; scrollbar-width: thin; }
.side-link {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; text-decoration: none; color: var(--side-text);
  font-size: 15px; font-weight: 500; margin-bottom: 2px;
}
.side-link svg { width: 18px; height: 18px; flex: none; color: var(--side-muted); }
.side-link:hover { background: var(--side-hover); }
.side-link.active { background: var(--side-active); font-weight: 650; }
.side-link.active svg { color: var(--accent); }
.side-link .badge { margin-left: auto; min-width: 20px; height: 20px; border-radius: 999px; background: var(--red); color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.side-link .badge.today { background: var(--orange); }
.side-h { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-muted); padding: 20px 12px 8px; }
.side-tag { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 9px; text-decoration: none; color: var(--side-text); font-size: 14.5px; }
.side-tag:hover { background: var(--side-hover); }
.side-tag.active { background: var(--side-active); }
.side-tag .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.side-tag .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-tag .n { margin-left: auto; color: var(--side-muted); font-size: 13px; }
.side-foot { display: flex; align-items: center; gap: 10px; padding: 10px; margin-top: 10px; border-radius: 12px; background: var(--side-hover); }
.side-foot .who { min-width: 0; flex: 1; text-decoration: none; color: var(--side-text); display: flex; align-items: center; gap: 10px; }
.side-foot .who div b { display: block; font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot .who div span { display: block; font-size: 12px; color: var(--side-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-foot .icon-btn { width: 32px; height: 32px; background: transparent; border-color: transparent; color: var(--side-muted); }
.side-foot .icon-btn:hover { color: var(--side-text); background: var(--side-hover); }
.side-foot .icon-btn svg { width: 16px; height: 16px; }

/* Meeting list rows (desktop list pane) */
.bucket-h { margin: 18px 6px 6px; }
.bucket-h:first-child { margin-top: 4px; }
.mrow { display: block; padding: 11px 13px; border-radius: 12px; border: 1.5px solid transparent; text-decoration: none; margin-bottom: 2px; }
.mrow:hover { background: var(--surface-2); }
.mrow.sel { border-color: var(--accent); background: var(--surface); box-shadow: 0 2px 10px rgba(255,122,69,0.12); }
.mrow .title { font-weight: 650; font-size: 15px; overflow-wrap: anywhere; margin-bottom: 2px; }
.mrow .tags-row { margin-top: 6px; }
label.mrow { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
label.mrow .check { margin-top: 1px; }
label.mrow.sel { box-shadow: 0 0 0 3px var(--accent-soft); }

/* Right rail and home */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.stat { text-align: center; padding: 12px 6px 10px; text-decoration: none; cursor: pointer; }
.stat:hover { border-color: var(--accent); }
.stat b { display: block; font-size: 26px; line-height: 1.1; font-weight: 750; }
.stat span { font-size: 12.5px; color: var(--muted); }
.stat.od b { color: var(--red); }
.stat.td b { color: var(--orange); }
.mini { display: flex; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border); align-items: flex-start; }
.mini:first-child { border-top: 0; }
.mini .check { margin-top: 0; width: 20px; height: 20px; }
.mini .body { min-width: 0; flex: 1; }
.mini .task { font-size: 14px; overflow-wrap: anywhere; line-height: 1.35; }
.mini .meta { font-size: 12.5px; margin-top: 1px; }
.mini .meta a { color: var(--muted); text-decoration: none; }
.mini .meta a:hover { color: var(--accent); }
.mini.done .task { text-decoration: line-through; color: var(--muted); }
.pill { flex: none; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; margin-top: 1px; }
.pill.overdue { background: var(--red-soft); color: var(--red); }
.pill.today { background: color-mix(in srgb, var(--orange) 15%, transparent); color: var(--orange); }
.pill.tomorrow { background: color-mix(in srgb, var(--blue) 13%, transparent); color: var(--blue); }
.cal { width: 40px; flex: none; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); text-align: center; background: var(--surface); }
.cal i { display: block; font-style: normal; background: var(--accent); color: #fff; font-size: 9.5px; font-weight: 750; letter-spacing: 0.06em; line-height: 15px; }
.cal b { display: block; font-size: 17px; line-height: 22px; font-weight: 750; }
.rail-more { display: block; padding: 8px 12px; font-size: 13px; color: var(--muted); text-decoration: none; border-top: 1px solid var(--border); }
.rail-more:hover { color: var(--accent); }

.greet { display: flex; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; margin-bottom: 18px; }
.greet h1 { margin: 0; font-size: 34px; }
.big-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.big-stat {
  position: relative; overflow: hidden; border-radius: 16px; padding: 16px 18px; color: #fff; text-decoration: none; cursor: pointer; border: 0; text-align: left;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08); transition: transform 0.12s;
}
.big-stat:hover { transform: translateY(-1px); }
.big-stat b { display: block; font-size: 34px; line-height: 1.1; font-weight: 750; }
.big-stat span { font-size: 15px; font-weight: 550; opacity: 0.95; }
.big-stat svg { position: absolute; right: -6px; bottom: -10px; width: 84px; height: 84px; opacity: 0.22; }
.big-stat.s-open { background: linear-gradient(135deg, #ff8a55, #f0602a); }
.big-stat.s-od { background: linear-gradient(135deg, #ee5a52, #c9302a); }
.big-stat.s-td { background: linear-gradient(135deg, #f5a33a, #e0821a); }
.big-stat.s-wk { background: linear-gradient(135deg, #4f8ff0, #2d64d0); }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
.col { background: var(--surface-2); border-radius: 16px; padding: 14px 12px; min-height: 160px; }
.col h2 { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
.col h2 .count { font-weight: 700; background: var(--surface); border-radius: 999px; padding: 0 8px; font-size: 12px; letter-spacing: 0; }
.col.overdue h2 { color: var(--red); }
.col.today h2 { color: var(--orange); }
.col.soon h2 { color: var(--blue); }
.tcard { display: flex; gap: 10px; padding: 11px 12px; margin-bottom: 8px; border-left: 3px solid var(--border); border-radius: 10px; align-items: flex-start; }
.col.overdue .tcard { border-left-color: var(--red); }
.col.today .tcard { border-left-color: var(--orange); }
.col.soon .tcard { border-left-color: var(--blue); }
.tcard .check { margin-top: 0; width: 20px; height: 20px; }
.tcard .body { min-width: 0; flex: 1; }
.tcard .task { font-weight: 650; overflow-wrap: anywhere; line-height: 1.35; }
.tcard .meta { margin-top: 4px; }
.tcard .meta a { color: var(--muted); text-decoration: none; }
.tcard .meta a:hover { color: var(--accent); }
.tcard.done .task { text-decoration: line-through; color: var(--muted); }
.col .empty { color: var(--muted); font-size: 14px; padding: 6px 4px; }
.col .more { display: block; font-size: 13px; color: var(--muted); padding: 2px 4px; text-decoration: none; }
.col .more:hover { color: var(--accent); }
.home-bottom { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { border: 1px solid var(--border); border-radius: 12px; padding: 8px; min-height: 96px; min-width: 0; }
.day.today { border: 2px solid var(--accent); padding: 7px; }
.day .dh { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
.day .ev { display: block; font-size: 12.5px; font-weight: 600; border-radius: 7px; padding: 4px 7px; margin-bottom: 5px; text-decoration: none; overflow-wrap: anywhere; line-height: 1.3;
  background: var(--accent-soft); color: var(--accent-strong); }
.day .ev.kd { background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--blue); }
@media (prefers-color-scheme: dark) { .day .ev { color: var(--accent); } .day .ev.kd { color: var(--blue); } }
.dec-list { list-style: none; margin: 0; padding: 0; }
.dec-list li { position: relative; padding: 0 0 10px 16px; }
.dec-list li::before { content: ""; position: absolute; left: 2px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: #2e9e5b; }
.dec-list .meta a { color: var(--muted); text-decoration: none; }
.dec-list .meta a:hover { color: var(--accent); }
@media (max-width: 900px) {
  .big-stats { grid-template-columns: repeat(2, 1fr); }
  .board, .home-bottom { grid-template-columns: 1fr; }
  .week { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* Desktop */
.crumb { font-size: 14px; color: var(--muted); white-space: nowrap; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--accent); }
.list-pane, .rail { display: none; }
@media (min-width: 1024px) {
  body.desk header.top { display: none; }
  body.desk main { margin-left: 240px; max-width: none; padding: 28px 44px 80px; }
  body.desk main.page > * { max-width: 980px; }
  body.desk main > .mcal { max-width: none; }
  body.desk main.page > .setup { margin: 0; }
  body.desk .toolbar { top: 0; }
  body.desk main.split { padding: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
  body.desk .list-pane {
    display: block; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface);
    border-right: 1px solid var(--border); padding: 24px 14px 40px;
  }
  body.desk .list-pane h1 { margin: 0 6px 14px; }
  body.desk .list-pane .search-row { margin-bottom: 10px; }
  body.desk .list-pane .chips { margin-bottom: 8px; padding: 0 2px; }
  body.desk .list-pane .select-bar, body.desk .list-pane .bulk-msg { box-shadow: none; }
  body.desk .detail { min-width: 0; padding: 0 40px 80px; }
  body.desk .detail .toolbar { margin: 0 -40px 22px; padding: 14px 40px; border-bottom: 1px solid var(--border); }
  body.desk .detail .title-input { font-size: 30px !important; }
  body.desk .rail {
    display: none; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--bg);
    border-left: 1px solid var(--border); padding: 24px 18px 40px;
  }
  body.desk .rail .card { box-shadow: none; }
}
@media (min-width: 1360px) {
  body.desk main.split { grid-template-columns: 360px minmax(0, 1fr) 330px; }
  body.desk .rail { display: block; }
}

.spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
</style>

}

}

// ---------- notes export ----------
function htmlEscape(s) {

/**

 * Empty sections are left out.

function notesModel(m, dateLine) {

  var sections = [];

    add("Summary", String(n.summary || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean).map(function (s) { return { t: "p", text: s }; }));
    add("Attendees", lis(n.attendees));

    var disc = [];
    if (topics.length) {

        var subs = Array.isArray(tp.subs) ? tp.subs : [];
        var body = [];
        pts.forEach(function (p, i) {

          if (txt) body.push({ t: "li", text: txt, level: 0 });
          strList(subs[i]).forEach(function (s) { body.push({ t: "li", text: s, level: txt ? 1 : 0 }); });
        });

      });

    add("Discussion", disc);
    add("Decisions", lis(n.decisions));
    add("Action items", notesItems(m).map(function (a) { return { t: "li", text: itemLine(a), level: 0 }; }));
    add("Open questions", lis(n.openQuestions));
    add("Next steps", lis(n.nextSteps));
    add("Key dates", lis(n.keyDates));

/** Plain text notes; `only` limits to the named sections. */
function modelToText(model, only) {
  var out = [model.title];
  if (model.dateLine) out.push(model.dateLine);
  model.sections.forEach(function (s) {
    if (only && only.indexOf(s.title) < 0) return;
    out.push("", s.title.toUpperCase());
    s.blocks.forEach(function (b) {
      if (b.t === "p") out.push(b.text);
      else if (b.t === "h3") out.push(b.text + ":");
      else if (s.title === "Action items") out.push(b.text);

var MAIL_FONT = "font-family:Calibri,Arial,Helvetica,sans-serif;";
/** HTML notes with inline styles that paste cleanly into Outlook and Gmail. */
function modelToHtml(model) {
  var h = [];
  h.push('<div style="' + MAIL_FONT + 'font-size:11pt;color:#222222;line-height:1.4">');
  h.push('<h1 style="' + MAIL_FONT + 'font-size:18pt;font-weight:bold;margin:0 0 2px 0;color:#111111">' + htmlEscape(model.title) + "</h1>");
  if (model.dateLine) h.push('<p style="' + MAIL_FONT + 'font-size:10pt;color:#666666;margin:0 0 10px 0">' + htmlEscape(model.dateLine) + "</p>");
  model.sections.forEach(function (s) {
    h.push('<h2 style="' + MAIL_FONT + 'font-size:13pt;font-weight:bold;margin:14px 0 4px 0;color:#c2491b">' + htmlEscape(s.title) + "</h2>");

        else h.push('<p style="' + MAIL_FONT + 'font-size:11pt;margin:0 0 6px 0">' + htmlEscape(b.text) + "</p>");

  /** Copies rich HTML plus plain text. Returns "rich", "plain" or "" (failed). */
  async function copyRich(html, text) {
    try {
      if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([text], { type: "text/plain" })
        })]);
        return "rich";
      }
    } catch (e) { /* fall through */ }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return "plain"; }
    } catch (e) { /* fall through */ }
    try {
      var ok = false;
      var onCopy = function (ev) { ev.clipboardData.setData("text/html", html); ev.clipboardData.setData("text/plain", text); ev.preventDefault(); ok = true; };
      document.addEventListener("copy", onCopy);
      document.execCommand("copy");
      document.removeEventListener("copy", onCopy);
      if (ok) return "rich";
    } catch (e) { /* ignore */ }
    return "";
  }

  function pinBtnWide(id) {

  /** An item's body that opens to the edit panel when clicked. `kids` is what it shows when closed. */
  function editableBody(r, row, rerender, showNote) {
    var kids = Array.prototype.slice.call(arguments, 4);
    var key = r.path + "#" + r.item.id, open = !!state.openNote[key];
    var note = r.item.note && String(r.item.note).trim();

    var body = el("div", { class: "body", title: open ? "" : "Click to edit" }, kids,

  var GROUP_LABEL = { overdue: "Overdue", today: "Today", tomorrow: "Tomorrow", later: "Later", none: "No date", done: "Done" };
  /** Grouped, tickable action item rows; `rerender` redraws the current view after a tick. */

    return groups.map(function (g) {
      return el("div", { class: "group " + g.key },

        el("div", { class: "card rows" }, g.rows.map(function (r) {

          var delBtn = el("button", { class: "btn ghost del-item", type: "button", title: "Delete action item", "aria-label": "Delete action item", text: "✕",
            onclick: async function () {

              delBtn.disabled = true;

            } });

              r.meetingTitle ? el("a", { href: "#/meeting/" + encodeURIComponent(r.meetingId), text: r.meetingTitle }) : el("span", { text: "Added by you" })));

  }

  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  function dayKey(d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  /** A month grid. events: [{date, label, kind: "item"|"mtg"|"date", overdue, href}]. Returns {node, selected()}. */
  function calendarGrid(events, rerender) {
    var now = new Date();
    if (!state.calMonth) state.calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    var m = state.calMonth;
    var byDay = {};
    events.forEach(function (e) { (byDay[dayKey(e.date)] = byDay[dayKey(e.date)] || []).push(e); });
    var head = el("div", { class: "cal-head" },
      el("button", { class: "btn ghost", type: "button", "aria-label": "Previous month", text: "‹", onclick: function () { state.calMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1); state.calDay = null; rerender(); } }),
      el("h2", { text: MONTH_NAMES[m.getMonth()] + " " + m.getFullYear() }),
      el("button", { class: "btn ghost", type: "button", text: "Today", onclick: function () { state.calMonth = new Date(now.getFullYear(), now.getMonth(), 1); state.calDay = dayKey(now); rerender(); } }),
      el("button", { class: "btn ghost", type: "button", "aria-label": "Next month", text: "›", onclick: function () { state.calMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1); state.calDay = null; rerender(); } }));
    var grid = el("div", { class: "cal-grid" });
    ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(function (d) { grid.append(el("div", { class: "cal-dow", text: d })); });
    var start = new Date(m.getFullYear(), m.getMonth(), 1 - new Date(m.getFullYear(), m.getMonth(), 1).getDay());
    var today0 = startOfDay(now);
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      if (i >= 35 && d.getMonth() !== m.getMonth()) break;
      var key = dayKey(d), evs = byDay[key] || [];
      (function (key, d, evs) {
        var cell = el("button", { type: "button", class: "cal-day" + (d.getMonth() !== m.getMonth() ? " out" : "") + (key === dayKey(now) ? " today" : "") + (state.calDay === key ? " sel" : ""),
          "aria-label": d.toDateString() + (evs.length ? ", " + evs.length + " entries" : ""),
          onclick: function () { state.calDay = state.calDay === key ? null : key; rerender(); } },
          el("span", { class: "n", text: String(d.getDate()) }),
          evs.slice(0, 3).map(function (e) { return el("span", { class: "cal-ev" + (e.kind === "mtg" ? " mtg" : "") + (e.overdue ? " od" : ""), text: e.label }); }),
          evs.length > 3 ? el("div", { class: "cal-more", text: "+" + (evs.length - 3) + " more" }) : null,
          evs.length ? el("div", { class: "dots" }, evs.slice(0, 6).map(function (e) { return el("span", { class: "cal-dot" + (e.kind === "mtg" ? " mtg" : "") }); })) : null);
        grid.append(cell);
      })(key, d, evs);
    }
    return { node: el("div", { class: "mcal" }, head, grid), events: function () { return state.calDay ? byDay[state.calDay] || [] : null; } };
  }

  function renderCalendar() {
    var today0 = startOfDay(new Date());
    var events = [];
    meetings().forEach(function (m) {
      var dt = new Date(m.data.date);
      if (!isNaN(dt.getTime())) events.push({ date: startOfDay(dt), kind: "mtg", label: m.data.title || "Meeting", href: "#/meeting/" + encodeURIComponent(meetingIdOf(m)) });
      strList((notesOf(m.data) || {}).keyDates).forEach(function (t) {

    var nodes = [el("h1", { text: "Calendar" }), cal.node];
    var sel = cal.events();
    if (sel) {
      nodes.push(el("div", { class: "card rows", style: "margin-top:14px" }, sel.length ? sel.map(function (e) {
        var kind = e.kind === "mtg" ? "Meeting" : e.kind === "date" ? "Key date" : "Due" + (e.owner ? " · " + e.owner : "");
        return el("a", { class: "lrow", href: e.href || null }, el("div", { class: "body" }, el("div", { class: "text", text: e.label }), el("div", { class: "meta", text: kind })));
      }) : el("div", { class: "lrow" }, el("div", { class: "body" }, el("div", { class: "meta", text: "Nothing on this day." })))));
    }

  }

  function renderActions() {
    var rows = allRows();
    var name = myName();
    var owners = {};
    rows.forEach(function (r) { splitOwners(r.item.owner).forEach(function (o) { if (!isEveryone(o)) owners[o.toLowerCase()] = owners[o.toLowerCase()] || o; }); });
    var ownerList = Object.keys(owners).map(function (k) { return owners[k]; }).sort(function (a, b) { return a.localeCompare(b); });
    if (state.owner && state.owner !== ME && !owners[state.owner.toLowerCase()]) state.owner = "";

    var sel = el("select", { "aria-label": "Owner" }, el("option", { value: "", text: "Everyone" }),
      el("option", { value: ME, text: "Assigned to me" + (name ? "" : " (“Me”)") }),
      ownerList.map(function (o) { return el("option", { value: o, text: o }); }));
    sel.value = state.owner;
    sel.addEventListener("change", function () { state.owner = sel.value; lsSet(KEY_OWNER, sel.value); renderActions(); });
    var itemTagList = allItemTags();
    if (state.actionTag && !itemTagList.some(function (t) { return lc(t) === lc(state.actionTag); })) state.actionTag = null;
    var tagSel = itemTagList.length ? el("select", { "aria-label": "Tag" }, el("option", { value: "", text: "All tags" }),
      itemTagList.map(function (t) { return el("option", { value: t, text: "#" + t }); })) : null;
    if (tagSel) { tagSel.value = state.actionTag || ""; tagSel.addEventListener("change", function () { state.actionTag = tagSel.value || null; renderActions(); }); }
    var doneT = el("input", { type: "checkbox", checked: state.showDone });
    doneT.addEventListener("change", function () { state.showDone = doneT.checked; lsSet(KEY_SHOWDONE, doneT.checked ? "1" : "0"); renderActions(); });
    var addBtn = el("button", { class: "btn primary", type: "button", text: "+ Add", onclick: function () { state.adding = !state.adding; renderActions(); } });

    var asCal = state.actionsView === "calendar";
    var viewBtn = el("button", { class: "btn", type: "button", text: asCal ? "List view" : "Calendar view", onclick: function () { state.actionsView = asCal ? "list" : "calendar"; lsSet("perronote.actionsView", state.actionsView); renderActions(); } });
    var nodes = [el("h1", { text: "Action items" }), summaryStrip(),
      el("div", { class: "filters" }, sel, tagSel, el("label", { class: "switch" }, doneT, "Show done"), viewBtn, addBtn)];
    if (state.owner === ME && !name) {
      nodes.push(el("p", { class: "small muted", style: "margin:-6px 0 14px" }, "Showing items owned by “Me”. ", el("a", { href: "#/settings", text: "Add your name in Settings" }), " to include ones with your name."));
    }

    if (state.adding) {
      var taskIn = el("input", { type: "text", class: "task-in", placeholder: "What needs doing?", "aria-label": "Task" });
      var dateIn = el("input", { type: "date", "aria-label": "Due date" });
      var submit = el("button", { class: "btn primary", type: "submit", text: "Add" });
      var formEl = el("form", { class: "card add-form" }, taskIn, dateIn, submit,
        el("button", { class: "btn ghost", type: "button", text: "Cancel", onclick: function () { state.adding = false; renderActions(); } }));
      formEl.addEventListener("submit", async function (ev) {
        ev.preventDefault();
        var task = taskIn.value.trim();
        if (!task) { taskIn.focus(); return; }
        submit.disabled = true; submit.textContent = "Adding…";
        var ok = await addLooseItem(task, dateIn.value);
        if (ok) state.adding = false;
        if (route().name === "actions") renderActions();
      });
      nodes.push(formEl);
      setTimeout(function () { taskIn.focus(); }, 0);
    }

    var filtered = rows.filter(function (r) {
      if (!state.showDone && r.item.done) return false;
      if (!hasTag(r.item, state.actionTag)) return false;
      if (state.owner === ME) return isMine(r.item.owner, name);
      if (state.owner) {
        var want = state.owner.toLowerCase();
        if (!splitOwners(r.item.owner).some(function (o) { return isEveryone(o) || o.toLowerCase() === want; })) return false;
      }

    });
    if (asCal) {
      var t0 = startOfDay(new Date()), evs = [], undated = [];
      filtered.forEach(function (r) {

        if (du) evs.push({ date: startOfDay(du), kind: "item", label: r.item.task, overdue: !r.item.done && du < t0, row: r });
        else undated.push(r);
      });
      var cal = calendarGrid(evs, renderActions);
      nodes.push(cal.node);
      var picked = cal.events();
      if (picked) nodes.push(picked.length ? actionGroups(picked.map(function (e) { return e.row; }), renderActions) : el("p", { class: "muted", text: "Nothing due on this day." }));
      if (undated.length) nodes.push(el("h2", { text: "No date" }), actionGroups(undated, renderActions));

  // ----- People -----
  function savedPeopleNames() {
    var f = state.files.get("people.json");
    return f && Array.isArray(f.data) ? f.data.map(function (p) { return p && p.name; }).filter(Boolean) : [];
  }
  function peopleList() { return buildPeople(meetings().map(function (m) { return m.data; }), looseItems(), myName(), savedPeopleNames()); }
  function renderPeople() {
    var people = peopleList();
    var search = el("input", { type: "search", id: "peopleSearch", placeholder: "Search people…", value: state.peopleSearch, "aria-label": "Search people" });
    var listEl = el("div");
    function fill() {
      listEl.replaceChildren();
      var q = state.peopleSearch.trim().toLowerCase();
      var shown = people.filter(function (p) { return !q || p.key.indexOf(q) >= 0; });
      if (!shown.length) {
        listEl.append(el("div", { class: "card notice" }, el("p", { class: "muted", text: people.length ? "No one matches." : "No attendees or owners in your notes yet." })));
        return;
      }
      listEl.append(el("div", { class: "card rows" }, shown.map(function (p) {
        return el("a", { class: "lrow", href: "#/person/" + encodeURIComponent(p.name) },
          el("div", { class: "body" },
            el("div", { class: "name", text: p.name }),
            el("div", { class: "meta" },
              el("span", { text: plural(p.meetings, "meeting") }),

          el("span", { class: "muted", "aria-hidden": "true", text: "›" }));

    mount([el("h1", { text: "People" }), el("div", { class: "search-row" }, search), listEl]);

  function renderPerson(rawName) {
    var name = myName();
    var key = canonPerson(rawName, name).toLowerCase();
    var person = peopleList().find(function (p) { return p.key === key; });
    var display = person ? person.name : canonPerson(rawName, name);
    var open = allRows().filter(function (r) { return !r.item.done && personOwns(r.item.owner, key, name); });
    var mts = meetings().filter(function (m) { return personInMeeting(m.data, key, name); });
    var nodes = [
      el("div", { class: "toolbar" }, el("a", { class: "btn ghost", href: "#/people", text: "← People" })),
      el("h1", { text: display }),
      el("p", { class: "muted", style: "margin:-8px 0 16px" }, plural(mts.length, "meeting") + " · " + open.length + " open action item" + (open.length === 1 ? "" : "s"),
        key === name.toLowerCase() && name ? " · that’s you" : null)

    if (groups.length) nodes.push(groups);
    else nodes.push(el("div", { class: "card notice", style: "margin-bottom:18px" }, el("p", { class: "muted", text: "Nothing open." })));

  // ----- Dates & risks -----
  function renderDates() {
    var today = new Date();
    var entries = [], risks = [];
    meetings().forEach(function (m) {
      var n = notesOf(m.data);
      if (!n) return;
      var base = { meetingTime: meetingTime(m.data), title: m.data.title || "Untitled meeting", id: meetingIdOf(m) };
      strList(n.keyDates).forEach(function (t) { entries.push(Object.assign({ text: t, date: parseKeyDate(t) }, base)); });
      strList(n.risks).forEach(function (t) { risks.push(Object.assign({ text: t }, base)); });
    });
    var g = sortKeyDates(entries, today);
    function meetingLink(e) { return el("a", { href: "#/meeting/" + encodeURIComponent(e.id), text: e.title }); }
    function whenText(e) {
      var diff = dayDiff(e.date, today);

    }
    function rowsCard(list, withDate) {
      return el("div", { class: "card rows" }, list.map(function (e) {
        return el("div", { class: "lrow" }, el("div", { class: "body" },
          el("div", { class: "text", text: e.text }),
          el("div", { class: "meta" }, withDate && e.date ? whenText(e) : null, meetingLink(e))));
      }));
    }
    var nodes = [el("h1", { text: "Dates & risks" }), el("h2", { text: "Key dates" })];
    if (!entries.length) nodes.push(el("div", { class: "card notice", style: "margin-bottom:18px" }, el("p", { class: "muted", text: "No key dates in your notes yet." })));
    else {
      nodes.push(g.upcoming.length ? rowsCard(g.upcoming, true) : el("div", { class: "card notice" }, el("p", { class: "muted", text: "No upcoming dates." })));
      if (g.past.length) nodes.push(el("details", { class: "fold" }, el("summary", { text: "Past (" + g.past.length + ")" }), rowsCard(g.past, true)));
      if (g.undated.length) nodes.push(el("details", { class: "fold" }, el("summary", { text: "No date (" + g.undated.length + ")" }), rowsCard(g.undated, false)));
      if (!g.past.length && !g.undated.length) nodes.push(el("div", { style: "height:18px" }));

    nodes.push(risks.length ? rowsCard(risks, false) : el("div", { class: "card notice" }, el("p", { class: "muted", text: "No risks or blockers in your notes." })));
    mount(nodes);
  }

  // ----- Manage tags -----
  function renderTags() {
    var all = meetings();
    var counts = tagCountsOf(all);
    var tags = Object.keys(counts).sort(function (a, b) { return a.localeCompare(b); });
    var busy = !!state.bulk;
    function pathsWith(tag) { return all.filter(function (m) { return Array.isArray(m.data.tags) && m.data.tags.indexOf(tag) >= 0; }).map(function (m) { return m.path; }); }
    function rename(from) {
      var to = prompt("Rename “" + from + "” to:", from);
      if (to == null) return;
      to = to.trim().replace(/\s+/g, " ").replace(/,/g, " ").trim();
      if (!to || to === from) return;
      var existing = tags.find(function (t) { return t !== from && t.toLowerCase() === to.toLowerCase(); });
      if (existing) {
        if (!confirm("“" + existing + "” already exists. Merge “" + from + "” into it? " + plural(counts[from], "meeting") + " will be updated.")) return;
        to = existing;
      }
      if (state.tag === from) state.tag = null;
      runBulk(pathsWith(from), function (obj) {
        var next = renameTagInList(obj.tags, from, to);
        if (!next) return false;
        obj.tags = next; return true;
      }, function (k) { return (existing ? "Merged “" + from + "” into “" + to + "” in " : "Renamed “" + from + "” to “" + to + "” in ") + plural(k, "meeting") + "."; });
    }
    function del(tag) {
      if (!confirm("Remove the tag “" + tag + "” from " + plural(counts[tag], "meeting") + "?")) return;
      if (state.tag === tag) state.tag = null;
      runBulk(pathsWith(tag), function (obj) {
        var next = removeTagFromList(obj.tags, tag);
        if (!next) return false;
        obj.tags = next; return true;
      }, function (k) { return "Removed “" + tag + "” from " + plural(k, "meeting") + "."; });
    }
    var nodes = [
      el("div", { class: "toolbar" }, el("a", { class: "btn ghost", href: "#/meetings", text: "← Meetings" })),
      el("h1", { text: "Manage tags" }),
      bulkNodes()
    ];
    if (!tags.length) nodes.push(el("div", { class: "card notice" }, el("p", { class: "muted", text: "No tags yet. Add them on a meeting, or use Select on the Meetings list." })));
    else nodes.push(el("div", { class: "card rows" }, tags.map(function (t) {
      return el("div", { class: "lrow" },
        el("div", { class: "body" }, el("span", { class: "tag", style: tagStyle(t), text: t }), el("div", { class: "meta", style: "margin-top:4px", text: plural(counts[t], "meeting") })),
        el("div", { class: "acts" },
          el("button", { class: "btn", type: "button", text: "Rename", disabled: busy, onclick: function () { rename(t); } }),
          el("button", { class: "btn danger", type: "button", text: "Delete", disabled: busy, onclick: function () { del(t); } })));
    })));
    nodes.push(el("p", { class: "small muted", style: "margin-top:12px", text: "Renaming to an existing tag merges them. Each change saves every affected meeting, one at a time." }));
    mount(nodes);
  }

  render();
})();
